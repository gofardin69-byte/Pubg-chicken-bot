<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Chicken Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🐔 PUBG Chicken Dashboard</h1>
    <p class="subtitle">Competition Score Manager</p>

    <div class="status">
      <span class="dot"></span>
      Demo Server Dashboard
    </div>

    <h2>Player Accounts</h2>
    <div id="players" class="players">Loading...</div>

    <div class="panel">
      <h2>Add Demo Chicken Points</h2>

      <label for="player">Select account</label>
      <select id="player">
        <option value="1">Main Account</option>
        <option value="2">Second Account</option>
      </select>

      <label for="amount">Amount</label>
      <input id="amount" type="number" min="1" max="1000" value="1">

      <button id="addButton">Add Demo Points</button>
      <p id="message"></p>
    </div>

    <p class="notice">
      Demo only: this dashboard does not connect to PUBG
      or send real Chicken gifts.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
